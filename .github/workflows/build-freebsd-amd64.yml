name: Build FreeBSD amd64 Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 从 tag 提取版本号（如 v1.0.0 → 1.0.0），手动触发时使用输入值或最新 tag
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-freebsd-amd64:
    name: Build FreeBSD amd64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: pnpm build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum

      - name: Prepare frontend assets for embedding
        run: |
          mkdir -p server/embedfs/dist
          if [ -d server/dist ]; then
            cp -R server/dist/. server/embedfs/dist/
          fi

      - name: Build FreeBSD amd64 binary
        working-directory: server
        env:
          GOOS: freebsd
          GOARCH: amd64
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p ../dist
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.isProduction=true" \
            -o ../dist/magicmail-freebsd-amd64 \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: magicmail-freebsd-amd64
          path: dist/magicmail-freebsd-amd64
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build-freebsd-amd64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: magicmail-freebsd-amd64
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Magicmail ${{ env.VERSION }}"
          files: |
            release-assets/magicmail-freebsd-amd64
